name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # This step evaluates the build script, so it resolves every plugin from
      # the remote repositories and fails the whole run when one of them is
      # briefly unavailable. Retry before giving up, so a registry blip does
      # not look like a broken commit.
      - name: Generate Gradle wrapper
        run: |
          for attempt in 1 2 3; do
            if gradle wrapper --gradle-version 8.10.2; then
              exit 0
            fi
            echo "::warning::Gradle wrapper generation failed (attempt $attempt/3), retrying"
            sleep 20
          done
          echo "::error::Gradle wrapper generation failed after 3 attempts"
          exit 1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/body-measure-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: body-measure-debug-apk
          path: app/build/outputs/apk/debug/body-measure-debug.apk
          if-no-files-found: error
          retention-days: 30
